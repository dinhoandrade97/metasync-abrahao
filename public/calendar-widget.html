<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <!-- FullCalendar CSS and Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales/pt-br.global.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --danger: #ef4444;
    }
    body {
      margin: 0; padding: 12px; font-family: 'Inter', sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 13px;
    }
    * { box-sizing: border-box; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: var(--danger); }
    
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; margin-bottom: 4px; color: var(--text-muted); }
    input, textarea {
      width: 100%; padding: 6px 8px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
      font-family: inherit; font-size: 12px;
    }
    .hidden { display: none !important; }
    .flex { display: flex; gap: 8px; }

    /* FullCalendar Dark Theme Adjustments for Widget */
    #calendar {
      margin-top: 10px;
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px;
      font-size: 12px; /* Smaller text for widget */
    }
    .fc-theme-standard td, .fc-theme-standard th { border-color: var(--border); }
    .fc-theme-standard .fc-scrollgrid { border-color: var(--border); }
    .fc-day-today { background: rgba(59, 130, 246, 0.1) !important; }
    .fc .fc-toolbar-title { font-size: 1.1em; color: var(--text); font-weight: 600; }
    .fc .fc-button-primary { background-color: var(--primary); border-color: var(--primary); font-size: 11px; padding: 4px 8px; }
    .fc .fc-button-primary:not(:disabled):active, .fc .fc-button-primary:not(:disabled).fc-button-active {
      background-color: #2563eb; border-color: #2563eb;
    }
    .fc-event {
      cursor: pointer;
    }
    
    /* Loading overlay */
    #loading-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.7); display: flex; align-items: center; justify-content: center;
      z-index: 10; font-weight: 600; color: var(--text);
    }
  </style>
</head>
<body>

  <div id="view-list" style="position: relative; min-height: 200px;">
    <div class="header">
      <h2>Agenda</h2>
      <select id="inbox-select" onchange="manualSelectInbox(this.value)" style="flex:1; margin: 0 10px; max-width: 150px; font-size: 11px; padding: 4px; background: var(--card-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px;">
        <option value="">Selecione...</option>
      </select>
      <button class="btn" onclick="showForm()">+ Novo</button>
    </div>
    
    <div id="loading-overlay" class="hidden">Carregando...</div>
    <div id="calendar"></div>
  </div>

  <div id="view-form" class="hidden">
    <div class="header">
      <h2 id="form-title">Novo Evento</h2>
      <button class="btn" style="background:transparent; border:1px solid var(--border)" onclick="showList()">Voltar</button>
    </div>
    <input type="hidden" id="f-id">
    <div class="form-group">
      <label>Título</label>
      <input type="text" id="f-title" required>
    </div>
    <div class="flex">
      <div class="form-group" style="flex:1">
        <label>Início</label>
        <input type="datetime-local" id="f-start" required>
      </div>
      <div class="form-group" style="flex:1">
        <label>Término</label>
        <input type="datetime-local" id="f-end" required>
      </div>
    </div>
    <div class="form-group">
      <label>Local / Link</label>
      <input type="text" id="f-location">
    </div>
    <div class="flex" style="margin-top: 15px;">
      <button class="btn btn-danger hidden" id="btn-delete" onclick="deleteEvent()" style="flex:1">Excluir</button>
      <button class="btn" onclick="saveEvent()" style="flex:2">Salvar</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    let inboxId = urlParams.get('inboxId') || null;
    let calendar = null;

    if (!token) {
      document.body.innerHTML = '<div style="color:var(--danger); padding: 20px;">Token ausente na URL. Configure o Dashboard App no Chatwoot com ?token=SuaSenha.</div>';
    }

    let currentAgentEmail = null;
    let loadInboxesTimeout = setTimeout(() => { 
      loadInboxes(); // Fallback se o Chatwoot demorar
    }, 2000);

    // Escutar mensagem do Chatwoot
    window.addEventListener("message", function (event) {
      try {
        const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        if (data.event === "appContext" && data.data) {
          
          // Capturar e-mail do atendente logado (Segurança da Agenda Global)
          if (data.data.currentAgent && data.data.currentAgent.email) {
            currentAgentEmail = data.data.currentAgent.email;
            clearTimeout(loadInboxesTimeout);
            loadInboxes(currentAgentEmail);
          }

          if (data.data.conversation && data.data.conversation.inbox_id) {
            const newInboxId = data.data.conversation.inbox_id;
            if (newInboxId !== inboxId) {
              inboxId = newInboxId;
              const sel = document.getElementById("inbox-select");
              if (sel) sel.value = inboxId;
              loadEvents();
            }
          }
        }
      } catch (e) {}
    });

    // Pede o contexto para o Chatwoot
    window.parent.postMessage('chatwoot-dashboard-app:fetch-info', '*');

    function getHeaders() {
      return { "Content-Type": "application/json", "Authorization": "Bearer " + token };
    }

    async function loadInboxes(agentEmail = null) {
      if (!token) return;
      const sel = document.getElementById("inbox-select");
      try {
        const url = agentEmail ? '/api/clients?agentEmail=' + encodeURIComponent(agentEmail) : '/api/clients';
        const res = await fetch(url, { headers: getHeaders() });
        if (!res.ok) {
          sel.innerHTML = `<option>Erro API: ${res.status}</option>`;
          return;
        }
        const clients = await res.json();
        
        sel.innerHTML = '<option value="">Selecione...</option>';
        const keys = Object.keys(clients);
        if (keys.length === 0) {
          sel.innerHTML = '<option value="">Nenhuma agenda autorizada</option>';
        } else {
          keys.forEach(id => {
            const opt = document.createElement("option");
            opt.value = id;
            opt.textContent = clients[id].name || `Inbox ${id}`;
            sel.appendChild(opt);
          });
          if (inboxId && clients[inboxId]) {
            sel.value = inboxId;
            loadEvents();
          }
        }
      } catch (e) {
        sel.innerHTML = `<option>Erro: ${e.message}</option>`;
      }
    }
    
    function manualSelectInbox(id) {
      if (!id) return;
      inboxId = id;
      loadEvents();
    }

    function initCalendar() {
      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'pt-br',
        height: 'auto',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        buttonText: {
          today: 'Hoje',
          month: 'Mês',
          week: 'Semana',
          day: 'Dia'
        },
        dateClick: function(info) {
          if (!inboxId) {
            alert("Selecione um cliente primeiro.");
            return;
          }
          showForm();
          const clickedDate = info.dateStr; // yyyy-mm-dd
          document.getElementById("form-title").textContent = "Novo Evento";
          document.getElementById("f-start").value = clickedDate + "T09:00";
          document.getElementById("f-end").value = clickedDate + "T10:00";
        },
        eventClick: function(info) {
          const ev = info.event;
          showForm();
          document.getElementById("form-title").textContent = "Editar Evento";
          document.getElementById("f-id").value = ev.id;
          document.getElementById("f-title").value = ev.title;
          document.getElementById("f-location").value = ev.extendedProps.location || "";
          
          if (ev.start) {
            document.getElementById("f-start").value = offsetToLocalISO(ev.start);
          }
          if (ev.end) {
            document.getElementById("f-end").value = offsetToLocalISO(ev.end);
          } else if (ev.start) {
            document.getElementById("f-end").value = offsetToLocalISO(ev.start);
          }
          document.getElementById("btn-delete").classList.remove("hidden");
        }
      });
      calendar.render();
    }

    function offsetToLocalISO(date) {
      const tzoffset = (new Date()).getTimezoneOffset() * 60000;
      return (new Date(date - tzoffset)).toISOString().slice(0, 16);
    }

    async function loadEvents() {
      if (!inboxId || !token) return;
      const loader = document.getElementById("loading-overlay");
      
      if (!calendar) initCalendar();
      
      loader.classList.remove("hidden");
      
      try {
        const res = await fetch(`/api/calendar/${inboxId}/events`, { headers: getHeaders() });
        if (!res.ok) throw new Error();
        const events = await res.json();
        
        calendar.removeAllEvents();
        
        events.forEach(ev => {
          const start = ev.start.dateTime || ev.start.date;
          const end = ev.end.dateTime || ev.end.date;
          calendar.addEvent({
            id: ev.id,
            title: ev.summary || "Sem Título",
            start: start,
            end: end,
            extendedProps: {
              location: ev.location
            },
            color: 'var(--primary)'
          });
        });
      } catch (e) {
        alert("Erro ao carregar eventos.");
      } finally {
        loader.classList.add("hidden");
      }
    }

    function showList() {
      document.getElementById("view-form").classList.add("hidden");
      document.getElementById("view-list").classList.remove("hidden");
      if (calendar) calendar.render(); // Re-render to fix sizing issues after unhiding
    }

    function showForm() {
      document.getElementById("view-list").classList.add("hidden");
      document.getElementById("view-form").classList.remove("hidden");
      document.getElementById("f-id").value = "";
      document.getElementById("f-title").value = "";
      document.getElementById("f-start").value = "";
      document.getElementById("f-end").value = "";
      document.getElementById("f-location").value = "";
      document.getElementById("btn-delete").classList.add("hidden");
    }

    async function saveEvent() {
      const id = document.getElementById("f-id").value;
      const summary = document.getElementById("f-title").value.trim();
      const start = document.getElementById("f-start").value;
      const end = document.getElementById("f-end").value;
      const location = document.getElementById("f-location").value.trim();

      if (!summary || !start || !end) return alert("Preencha título e datas");

      const payload = { summary, location, start: new Date(start).toISOString(), end: new Date(end).toISOString() };

      try {
        const res = await fetch(`/api/calendar/${inboxId}/events${id ? `/${id}` : ''}`, {
          method: id ? "PATCH" : "POST",
          headers: getHeaders(),
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          const errData = await res.json().catch(()=>({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }
        showList();
        loadEvents();
      } catch (e) {
        alert("Erro ao salvar: " + (e.message || "Falha na conexão (Verifique adblocker)"));
      }
    }

    async function deleteEvent() {
      if (!confirm("Tem certeza que deseja excluir este evento?")) return;
      const id = document.getElementById("f-id").value;
      try {
        const res = await fetch(`/api/calendar/${inboxId}/events/${id}`, {
          method: "DELETE", headers: getHeaders()
        });
        if (!res.ok) {
          const errData = await res.json().catch(()=>({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }
        showList();
        loadEvents();
      } catch (e) {
        alert("Erro ao excluir: " + (e.message || "Falha na conexão"));
      }
    }
  </script>
</body>
</html>
